server:
  port: ${SPRING_PORT:8080}
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui: 
    path: /swagger-ui.html
  api-docs: 
    path: /v1/api-docs

spring:
  application:
    name: backend_ecommerce

  config:
    import:
      - optional:file:.env[.yml]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true 
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

refresh:
  expiry-date: 900000
