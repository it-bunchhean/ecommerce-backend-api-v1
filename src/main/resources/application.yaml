server:
  port: ${SPRING_PORT:8080}
  servlet:
    context-path: /api/v1/

  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

springdoc:
  swagger-ui: 
    path: /swagger-ui.html
  api-docs: 
    path: /api-docs

spring:
  application:
    name: backend_ecommerce
  profile:
    activate: ${SPRING_PROFILES_ACTIVE}
  config:
    import:
      - optional:file:.env[.yml]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true 
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway: 
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION:900000}

refresh:
  expiry-date: 900000